<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <nav>
        <a href="index.html">
            <img src="css/img/logo-greenshool.png" alt="Logo">
        </a>
        <ul>
            <li><a href="product.html">Product</a></li>
            <li><a href="about.html">About us</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <section class="green">
        <h1>Contact Form</h1>
        <p>
            We would love to hear from you! Please fill out the form below and we'll get back to you as soon as possible.
        </p>
    </section>
    <section class="white">
        <form action="submit_form.php" method="post">
            <div>
                <div>
                    <label for="fname" placeholder="John">First Name:</label>
                    <input type="text" id="fname" name="fname" required>
                </div>
                <div>
                    <label for="lname" placeholder="Doe">Last Name:</label>
                    <input type="text" id="lname" name="lname" required>     
                </div>         
            </div>
            <div>
                <div>
                    <label for="email" placeholder="john.doe@example.com">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="phone" placeholder="123-456-7890">Phone:</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
            </div>
            <div>
                <div>
                    <label for="Educational institution" placeholder="University of Example">Educational Institution:</label>
                    <input type="text" id="Educational institution" name="Educational institution" required>
                </div>
            </div>            
            <div>
                <div>
                    <label for="address" placeholder="123 Main St">Address:</label>
                    <input type="text" id="address" name="address" required>
                </div>
            </div>
            <div>
                <div>
                    <label for="house number" placeholder="123">House Number:</label>
                    <input type="text" id="house number" name="house number" required>
                </div>
                <div>
                    <label for="zip" placeholder="12345">ZIP Code:</label>
                    <input type="text" id="zip" name="zip" required>
                </div>
            </div>
            <div>
                <div>
                    <label for="city" placeholder="Anytown">City:</label>
                    <input type="text" id="city" name="city" required>
                </div>
            </div>
            <div>
                <div>
                    <label for="subject">Subject:</label>
                    <select id="subject" name="subject" required>
                        <option value="">Select a subject</option>
                        <option value="product">Product</option>
                        <option value="order">Order Inquiry</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>
            <div>
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required></textarea>                      
                </div>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </section>
    <footer>
        <ul>
            <li>Privacy</li>

        </ul>
