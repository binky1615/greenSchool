<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <nav>
        <a href="index.html">
            <img src="css/img/logo-greenshool.png" alt="Logo">
        </a>
        <ul>
            <li><a href="product.html">Product</a></li>
            <li><a href="about.html">About us</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <section class="green">
        <h1>Contact</h1>
        <p>Do you have a question about our product or something else? Feel free to contact us by filling in the form below.</p>
    </section>

    <section class="form-section">
        <h2>Contact Form</h2>

        <form action="submit_form.php" method="post">
            <div class="row">
                <div class="field">
                    <label for="fname">First Name</label>
                    <input type="text" id="fname" name="fname" placeholder="First name" required>
                </div>
                <div class="field">
                    <label for="lname">Last Name</label>
                    <input type="text" id="lname" name="lname" placeholder="Last name" required>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
                </div>
                <div class="field">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                </div>
            </div>

            <div class="field">
                <label for="school">Educational Institution</label>
                <input type="text" id="school" name="school" placeholder="Type your educational institution..." required>
            </div>

            <h3>Address</h3>

            <div class="field">
                <label for="address">Street Name</label>
                <input type="text" id="address" name="address" placeholder="Enter your street name" required>
            </div>

            <div class="row">
                <div class="field">
                    <label for="house_number">House Number</label>
                    <input type="text" id="house_number" name="house_number" placeholder="123" required>
                </div>
                <div class="field">
                    <label for="zip">ZIP Code</label>
                    <input type="text" id="zip" name="zip" placeholder="12345" required>
                </div>
            </div>

            <div class="field">
                <label for="city">City</label>
                <input type="text" id="city" name="city" placeholder="Enter the city of the school" required>
            </div>

            <div class="field">
                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="">Choose a subject...</option>
                    <option value="product">Question about our product</option>
                    <option value="order">Question about my order</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type your message here...." required></textarea>
            </div>

            <label class="checkbox">
                <input type="checkbox" name="terms" required>
                I agree to the terms and conditions
            </label>

            <button type="submit">Send</button>
        </form>
    </section>

    <footer>
        <ul>
            <li><a href="#">Privacy Policy</a></li>
            <li><a href="#">Cookie Policy</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <p>&copy; 2026 GreenSchool. All rights reserved.</p>
    </footer>
</body>
</html>
