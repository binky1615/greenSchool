    <section class="green">
        <h1>New</h1>
    </section>
    <section class="white">
        <form action="submit_form.php" method="post">
            <div>
                <label for="fname" placeholder="John">First Name:</label>
                <input type="text" id="fname" name="fname" required>
                <label for="lname" placeholder="Doe">Last Name:</label>
                <input type="text" id="lname" name="lname" required>              
            </div>
            <div>
                <label for="email" placeholder="john.doe@example.com">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="Educational institution" placeholder="University of Example">Educational Institution:</label>
                <input type="text" id="Educational institution" name="Educational institution" required>
            </div>            
            <div>
                <label for="address" placeholder="123 Main St">Address:</label>
                <input type="text" id="address" name="address" required>
                <label for="city" placeholder="Anytown">City:</label>
                <input type="text" id="city" name="city" required>
            </div>
            <div>
                <label for="subject">Subject:</label>
                <select id="subject" name="subject" required>
                    <option value="">Select a subject</option>
                    <option value="general">General Inquiry</option>
                    <option value="support">Support</option>
                    <option value="feedback">Feedback</option>
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>                
            </div>
            <button type="submit">Send Message</button>
        </form>
    </section>
